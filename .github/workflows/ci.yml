name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.7.3'
  CF_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.0-build.{0}', github.run_number) }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            qt_arch: win64_msvc2019_64
          - name: linux-x86_64
            os: ubuntu-latest
            qt_arch: ''
          - name: macos-universal
            os: macos-latest
            qt_arch: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: install-qt-${{ env.QT_VERSION }}

      - name: Stub AGL framework (macOS SDK removed it, Qt still links it)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --show-sdk-path)"
          AGL_DIR="${SDK_PATH}/System/Library/Frameworks/AGL.framework"
          if [ ! -e "${AGL_DIR}" ]; then
            sudo mkdir -p "${AGL_DIR}/Versions/A"
            # An empty Mach-O dylib is guaranteed to be recognized by ld,
            # unlike a hand-written .tbd (parser format quirks). CodeForge
            # and Qt's runtime GL backend do not call any AGL symbol.
            printf '' | clang -x c - -dynamiclib -o /tmp/AGLStub.dylib \
              -arch arm64 -arch x86_64 \
              -Wl,-install_name,/System/Library/Frameworks/AGL.framework/Versions/A/AGL \
              -Wl,-current_version,65 -Wl,-compatibility_version,1
            sudo cp /tmp/AGLStub.dylib "${AGL_DIR}/Versions/A/AGL"
            sudo ln -sfn A "${AGL_DIR}/Versions/Current"
            sudo ln -sfn Versions/A/AGL "${AGL_DIR}/AGL"
            sudo ln -sfn Versions/A "${AGL_DIR}/Resources"
            echo "AGL stub dylib created at ${AGL_DIR}"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.name }}
          variant: ccache
          max-size: 300M

      - name: Configure (CMake + Ninja, Release)
        shell: bash
        run: |
          OSX_ARGS=""
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # Qt 6 macOS binaries are universal2; build a universal app so one
            # artifact supports both Apple Silicon and Intel Macs.
            OSX_ARGS='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" ${OSX_ARGS}

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH}"
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          windeployqt --release --no-translations build\bin\CodeForge.exe
          Compress-Archive -Path build\bin\* -DestinationPath "dist/CodeForge-${{ env.CF_VERSION }}-${{ matrix.name }}.zip" -Force

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist AppDir/usr/bin
          cp build/bin/CodeForge AppDir/usr/bin/CodeForge
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          # linuxdeploy discovers plugins in PATH under the exact name
          # "linuxdeploy-plugin-<name>" (no arch suffix)
          cp linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          QMAKE_BIN="$(command -v qmake || true)"
          if [ -z "$QMAKE_BIN" ]; then QMAKE_BIN="$(command -v qmake6 || true)"; fi
          export LINUXDEPLOY_PLUGIN_QT_QMAKE="$QMAKE_BIN"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$PWD/AppDir" \
            -e AppDir/usr/bin/CodeForge \
            -i packaging/linux/codeforge.png \
            -d packaging/linux/codeforge.desktop \
            --plugin qt \
            --output appimage
          mv CodeForge-*.AppImage "dist/CodeForge-${{ env.CF_VERSION }}-${{ matrix.name }}.AppImage"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          macdeployqt build/bin/CodeForge.app -verbose=1
          ditto -c -k --keepParent build/bin/CodeForge.app "dist/CodeForge-${{ env.CF_VERSION }}-${{ matrix.name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **CodeForge ${{ github.ref_name }}** — lightweight native code editor (C++ / Qt 6)

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows 10/11 x64 | `CodeForge-*-windows-x64.zip` — extract & run `CodeForge.exe` (portable-friendly) |
            | Linux x86_64 | `CodeForge-*-linux-x86_64.AppImage` — `chmod +x` then run |
            | macOS (universal: Apple Silicon + Intel) | `CodeForge-*-macos-universal.zip` |

            > macOS builds are unsigned — on first launch right-click → Open (Gatekeeper).
            > Windows builds are portable: no installer required, settings live next to the exe when a `portable/` folder exists.
