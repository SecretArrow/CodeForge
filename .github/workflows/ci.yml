name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.7.3'
  CF_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.0-build.{0}', github.run_number) }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            qt_arch: win64_msvc2019_64
          - name: linux-x86_64
            os: ubuntu-latest
            qt_arch: ''
          - name: macos-universal
            os: macos-latest
            qt_arch: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          cache-key-prefix: install-qt-${{ env.QT_VERSION }}

      - name: Stub AGL framework (macOS SDK removed it, Qt still links it)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --show-sdk-path)"
          AGL_DIR="${SDK_PATH}/System/Library/Frameworks/AGL.framework"
          if [ ! -e "${AGL_DIR}" ]; then
            sudo mkdir -p "${AGL_DIR}/Versions/A"
            # An empty Mach-O dylib is guaranteed to be recognized by ld,
            # unlike a hand-written .tbd (parser format quirks). CodeForge
            # and Qt's runtime GL backend do not call any AGL symbol.
            printf '' | clang -x c - -dynamiclib -o /tmp/AGLStub.dylib \
              -arch arm64 -arch x86_64 \
              -Wl,-install_name,/System/Library/Frameworks/AGL.framework/Versions/A/AGL \
              -Wl,-current_version,65 -Wl,-compatibility_version,1
            sudo cp /tmp/AGLStub.dylib "${AGL_DIR}/Versions/A/AGL"
            sudo ln -sfn A "${AGL_DIR}/Versions/Current"
            sudo ln -sfn Versions/A/AGL "${AGL_DIR}/AGL"
            sudo ln -sfn Versions/A "${AGL_DIR}/Resources"
            echo "AGL stub dylib created at ${AGL_DIR}"
          fi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ matrix.name }}
          variant: ccache
          max-size: 300M

      - name: Configure (CMake + Ninja, Release)
        shell: bash
        run: |
          OSX_ARGS=""
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # Qt 6 macOS binaries are universal2; build a universal app so one
            # artifact supports both Apple Silicon and Intel Macs.
            OSX_ARGS='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" ${OSX_ARGS}

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Run unit tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH}"
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure

      - name: "Package (Windows: deploy, sign, installer, portable zip)"
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          windeployqt --release --no-translations build\bin\CodeForge.exe

          # ---- Code signing (SmartScreen hardening) ----
          # Priority 1: repository secret (stable publisher identity).
          # Priority 2: ephemeral self-signed cert generated in CI; the public
          #             .cer is shipped in every release so users can trust it.
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "CodeForge.cer"
          if ($env:CODESIGN_PFX_B64) {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))
            Write-Host "Signing with repository-provided certificate"
            # Publish the public half so users can trust the publisher.
            $x509 = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
            $x509.Import($pfxPath, $env:CODESIGN_PFX_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable)
            [IO.File]::WriteAllBytes($cerPath, $x509.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          } else {
            Write-Host "No CODESIGN_PFX secret - generating a self-signed project certificate"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert `
              -Subject "CN=CodeForge Project, O=CodeForge, C=US" `
              -KeyUsage DigitalSignature -KeyExportPolicy Exportable `
              -HashAlgorithm SHA256 -KeyLength 3072 `
              -NotAfter (Get-Date).AddYears(5) -CertStoreLocation Cert:\CurrentUser\My
            $pwdPlain = [Guid]::NewGuid().ToString("N")
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password (ConvertTo-SecureString $pwdPlain -AsPlainText -Force) | Out-Null
            $env:CODESIGN_PFX_PASSWORD = $pwdPlain
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }

          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfxPath /p $env:CODESIGN_PFX_PASSWORD build\bin\CodeForge.exe
          if ($LASTEXITCODE -ne 0) { throw "signing CodeForge.exe failed" }

          # ---- Inno Setup installer ----
          choco install innosetup -y --no-progress | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:CF_VERSION" "/DPayloadDir=build\bin" installer\CodeForge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          # Sign the installer itself (Authenticode on the outer exe).
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfxPath /p $env:CODESIGN_PFX_PASSWORD installer\Output\CodeForgeSetup-*.exe
          if ($LASTEXITCODE -ne 0) { throw "signing installer failed" }
          Move-Item installer\Output\CodeForgeSetup-*.exe dist\

          # Publish the public certificate so users can trust the publisher.
          if (Test-Path $cerPath) { Copy-Item $cerPath dist\CodeForge.cer }

          # ---- Portable zip with SmartScreen helpers ----
          Copy-Item packaging\windows\Unblock-CodeForge.ps1 build\bin\
          Copy-Item packaging\windows\Trust-CodeForgeCertificate.ps1 build\bin\
          Copy-Item packaging\windows\README-SMARTSCREEN.txt build\bin\
          if (Test-Path $cerPath) { Copy-Item $cerPath build\bin\ }
          Compress-Archive -Path build\bin\* -DestinationPath "dist/CodeForge-$env:CF_VERSION-windows-x64.zip" -Force
          if (Test-Path packaging\windows\SMARTSCREEN.md) { Copy-Item packaging\windows\SMARTSCREEN.md dist\SMARTSCREEN.md }

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist AppDir/usr/bin
          cp build/bin/CodeForge AppDir/usr/bin/CodeForge
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          # linuxdeploy discovers plugins in PATH under the exact name
          # "linuxdeploy-plugin-<name>" (no arch suffix)
          cp linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          QMAKE_BIN="$(command -v qmake || true)"
          if [ -z "$QMAKE_BIN" ]; then QMAKE_BIN="$(command -v qmake6 || true)"; fi
          export LINUXDEPLOY_PLUGIN_QT_QMAKE="$QMAKE_BIN"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$PWD/AppDir" \
            -e AppDir/usr/bin/CodeForge \
            -i packaging/linux/codeforge.png \
            -d packaging/linux/codeforge.desktop \
            --plugin qt \
            --output appimage
          mv CodeForge-*.AppImage "dist/CodeForge-${{ env.CF_VERSION }}-${{ matrix.name }}.AppImage"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          macdeployqt build/bin/CodeForge.app -verbose=1
          ditto -c -k --keepParent build/bin/CodeForge.app "dist/CodeForge-${CF_VERSION}-${{ matrix.name }}.zip"

      - name: SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist\* | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CodeForge-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - name: SHA256 checksums (release)
        shell: bash
        run: |
          cd dist
          ls * | grep -v SHA256SUMS | xargs sha256sum > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **CodeForge ${{ github.ref_name }}** — lightweight native code editor (C++ / Qt 6)

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows 10/11 x64 (installer) | `CodeForgeSetup-*-x64.exe` — signed installer with file associations |
            | Windows 10/11 x64 (portable) | `CodeForge-*-windows-x64.zip` — extract & run `CodeForge.exe` |
            | Linux x86_64 | `CodeForge-*-linux-x86_64.AppImage` — `chmod +x` then run |
            | macOS (universal) | `CodeForge-*-macos-universal.zip` |
            | Integrity | `SHA256SUMS.txt` — verify with `Get-FileHash <file> -Algorithm SHA256` |

            ### Windows SmartScreen notice / Peringatan SmartScreen
            New releases have no SmartScreen reputation yet. When "Windows protected your PC" appears: **More info → Run anyway**.
            Rilis baru belum memiliki reputasi SmartScreen. Saat dialog muncul: **More info → Run anyway**.

            Windows binaries are **code-signed** ("CodeForge Project"). Trust the shipped
            `CodeForge.cer` to show the verified publisher and silence future warnings:

            ```powershell
            powershell -ExecutionPolicy Bypass -File .\Trust-CodeForgeCertificate.ps1 -CertFile .\CodeForge.cer
            ```

            Portable users: run `Unblock-CodeForge.ps1` once after extracting. Full guide: `SMARTSCREEN.md` in this release.

            > macOS builds are unsigned — on first launch right-click → Open (Gatekeeper).
            > Windows portable builds run settings-free next to the exe when a `portable/` folder exists.
            > Offline-first. No telemetry. Ever.
